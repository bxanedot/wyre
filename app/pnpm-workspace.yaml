allowBuilds:
  # Build tooling uses esbuild. Only the exact
  # versions recorded in the lockfile may run native installation scripts.
  # A version change remains blocked until it is reviewed explicitly.
  esbuild@0.28.1: true
  vue-demi: false
overrides:
  esbuild: 0.28.1
# pnpm 11 rejects packages published less than 24 hours ago by default.
# This reviewed lockfile version was temporarily exempted during its release
# window; all other dependencies keep the default supply-chain protection.
minimumReleaseAgeExclude:
  - postcss@8.5.19
