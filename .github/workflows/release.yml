name: Build and publish Wyre

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Install bxane's signing certificate
        id: windows-signing
        env:
          WYRE_WINDOWS_PFX: ${{ secrets.WYRE_WINDOWS_PFX }}
          WYRE_WINDOWS_PFX_PASSWORD: ${{ secrets.WYRE_WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WYRE_WINDOWS_PFX -or -not $env:WYRE_WINDOWS_PFX_PASSWORD) { throw 'Set WYRE_WINDOWS_PFX and WYRE_WINDOWS_PFX_PASSWORD in repository Actions secrets.' }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'wyre-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WYRE_WINDOWS_PFX))
          $password = ConvertTo-SecureString $env:WYRE_WINDOWS_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfxPath
          if (-not $certificate -or $certificate.Subject -notmatch 'CN=bxane') { throw 'The configured Windows certificate must identify bxane.' }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'wyre-signing.cer'
          Export-Certificate -Cert $certificate -FilePath $certificatePath -Force | Out-Null
          Import-Certificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\Root | Out-Null
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Build Wyre installer
        working-directory: app
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ steps.windows-signing.outputs.thumbprint }}
          WYRE_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ steps.windows-signing.outputs.thumbprint }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WYRE_PRIVILEGED_SIGN_COMMAND: '["powershell.exe","-NoProfile","-NonInteractive","-ExecutionPolicy","Bypass","-File","scripts/sign-windows-file.ps1","{file}"]'
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Set TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD in repository Actions secrets using the private key paired with plugins.updater.pubkey.' }
          $modulePath = $env:PSModulePath
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
          try {
            pnpm tauri:build
            if ($LASTEXITCODE -ne 0) { throw "Tauri build failed with exit code $LASTEXITCODE" }
          } finally {
            $env:PSModulePath = $modulePath
          }
          New-Item -ItemType Directory -Force ..\release\windows | Out-Null
          $installers = Get-ChildItem target\release\bundle\nsis -Filter '*.exe'
          if (-not $installers) { throw 'Tauri did not produce a Windows NSIS installer.' }
          Copy-Item $installers.FullName ..\release\windows\
          $certificatePath = Join-Path $env:RUNNER_TEMP 'wyre-signing.cer'
          Export-Certificate -Cert (Get-Item "Cert:\CurrentUser\My\$env:WINDOWS_CERTIFICATE_THUMBPRINT") -FilePath $certificatePath -Force | Out-Null
          Copy-Item $certificatePath ..\release\windows\Wyre-signing.cer
          foreach ($file in Get-ChildItem ..\release\windows -Filter '*.exe') {
            & pwsh.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/sign-windows-file.ps1 $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Windows signing failed: $($file.Name)" }
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT) { throw "Windows signature verification failed: $($file.Name)" }
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            pnpm exec tauri signer sign --app-version $version $file.FullName
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$($file.FullName).sig")) { throw "Updater signature generation failed: $($file.Name)" }
          }
          Get-ChildItem ..\release\windows -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content ..\release\windows\SHA256SUMS-Windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wyre-windows
          path: release/

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Build Linux installers
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Set TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD in repository Actions secrets using the private key paired with plugins.updater.pubkey.' >&2; exit 1; }
          pnpm tauri:build:linux
          mkdir -p ../release/linux
          cp target/release/bundle/appimage/*.AppImage ../release/linux/
          cp target/release/bundle/appimage/*.AppImage.sig ../release/linux/
          cp target/release/bundle/deb/*.deb ../release/linux/
          cd ../release/linux
          sha256sum *.AppImage *.deb > SHA256SUMS-Linux.txt
      - name: Sign Linux installers with bxane's GPG key
        env:
          WYRE_GPG_PRIVATE_KEY: ${{ secrets.WYRE_GPG_PRIVATE_KEY }}
          WYRE_GPG_PASSPHRASE: ${{ secrets.WYRE_GPG_PASSPHRASE }}
          WYRE_GPG_KEY_ID: ${{ secrets.WYRE_GPG_KEY_ID }}
        run: |
          test -n "$WYRE_GPG_PRIVATE_KEY" && test -n "$WYRE_GPG_PASSPHRASE" && test -n "$WYRE_GPG_KEY_ID" || { echo 'Set WYRE_GPG_PRIVATE_KEY, WYRE_GPG_PASSPHRASE, and WYRE_GPG_KEY_ID in repository Actions secrets.' >&2; exit 1; }
          printf '%s' "$WYRE_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-keys "$WYRE_GPG_KEY_ID" | grep -qi bxane || { echo 'The configured GPG signing key must identify bxane.' >&2; exit 1; }
          gpg --armor --export "$WYRE_GPG_KEY_ID" > release/linux/Wyre-signing-key.asc
          cd release/linux
          for file in *.AppImage *.deb SHA256SUMS-Linux.txt; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$WYRE_GPG_PASSPHRASE" --armor --detach-sign "$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wyre-linux
          path: release/

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create signed updater manifest
        run: node scripts/create-updater-manifest.mjs
      - uses: softprops/action-gh-release@v2
        with:
          name: Wyre ${{ github.ref_name }}
          files: |
            release/**
            CHANGELOG.md
          body_path: CHANGELOG.md
