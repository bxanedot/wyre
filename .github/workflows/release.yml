name: Signed release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require the bxane signing certificate
        env:
          WYRE_WINDOWS_PFX: ${{ secrets.WYRE_WINDOWS_PFX }}
          WYRE_WINDOWS_PFX_PASSWORD: ${{ secrets.WYRE_WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WYRE_WINDOWS_PFX -or -not $env:WYRE_WINDOWS_PFX_PASSWORD) { throw 'Set WYRE_WINDOWS_PFX and WYRE_WINDOWS_PFX_PASSWORD in repository Actions secrets.' }
      - run: npm ci
      - run: npm run dist:win
      - name: Sign and verify installer files
        env:
          WIN_CSC_LINK: ${{ secrets.WYRE_WINDOWS_PFX }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WYRE_WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'wyre-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WIN_CSC_LINK))
          $securePassword = ConvertTo-SecureString $env:WIN_CSC_KEY_PASSWORD -AsPlainText -Force
          $certificate = (Get-PfxData -FilePath $pfxPath -Password $securePassword).EndEntityCertificates | Select-Object -First 1
          $certPath = Join-Path $env:RUNNER_TEMP 'wyre-signing.cer'
          Export-Certificate -Cert $certificate -FilePath $certPath | Out-Null
          Import-Certificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\Root | Out-Null
          Copy-Item $certPath dist/Wyre-signing-cert.cer
          if ($certificate.Subject -notmatch 'CN=bxane') { throw 'The configured signing certificate subject must identify bxane.' }
          $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
          $files = Get-ChildItem dist -Filter '*.exe' -Recurse
          if (-not $files) { throw 'No Windows executables were produced.' }
          foreach ($file in $files) {
            & $signtool sign /f $pfxPath /p $env:WIN_CSC_KEY_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed: $($file.Name)" }
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint) { throw "Signature verification failed: $($file.Name)" }
          }
          Remove-Item $pfxPath
      - name: Create checksums
        shell: pwsh
        run: Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content dist/SHA256SUMS-Windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wyre-windows
          path: dist/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require the bxane signing certificate
        env:
          WYRE_WINDOWS_PFX: ${{ secrets.WYRE_WINDOWS_PFX }}
          WYRE_WINDOWS_PFX_PASSWORD: ${{ secrets.WYRE_WINDOWS_PFX_PASSWORD }}
        run: test -n "$WYRE_WINDOWS_PFX" && test -n "$WYRE_WINDOWS_PFX_PASSWORD"
      - run: npm ci
      - run: npm run dist:linux
      - name: Sign packages and checksums
        env:
          WYRE_WINDOWS_PFX: ${{ secrets.WYRE_WINDOWS_PFX }}
          WYRE_WINDOWS_PFX_PASSWORD: ${{ secrets.WYRE_WINDOWS_PFX_PASSWORD }}
        shell: bash
        run: |
          printf '%s' "$WYRE_WINDOWS_PFX" | base64 --decode > "$RUNNER_TEMP/wyre-signing.pfx"
          openssl pkcs12 -in "$RUNNER_TEMP/wyre-signing.pfx" -clcerts -nokeys -passin env:WYRE_WINDOWS_PFX_PASSWORD -out "$RUNNER_TEMP/wyre-cert.pem"
          openssl pkcs12 -in "$RUNNER_TEMP/wyre-signing.pfx" -nocerts -nodes -passin env:WYRE_WINDOWS_PFX_PASSWORD -out "$RUNNER_TEMP/wyre-key.pem"
          openssl x509 -in "$RUNNER_TEMP/wyre-cert.pem" -out dist/Wyre-signing-cert.pem
          openssl x509 -in "$RUNNER_TEMP/wyre-cert.pem" -noout -subject -fingerprint -sha256
          cd dist
          sha256sum * > SHA256SUMS-Linux.txt
          for file in *.AppImage *.deb SHA256SUMS-Linux.txt; do
            if [ -f "$file" ]; then
              openssl cms -sign -binary -in "$file" -signer "$RUNNER_TEMP/wyre-cert.pem" -inkey "$RUNNER_TEMP/wyre-key.pem" -outform DER -out "$file.p7s" -nosmimecap -md sha256
              openssl cms -verify -binary -inform DER -in "$file.p7s" -content "$file" -noverify -out /dev/null
            fi
          done
          rm -f "$RUNNER_TEMP/wyre-signing.pfx" "$RUNNER_TEMP/wyre-key.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: wyre-linux
          path: dist/*

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: CHANGELOG.md
