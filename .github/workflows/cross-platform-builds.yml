name: Cross-platform builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rust-src-dir: app
          cache-workspaces: app -> target
          cache-key: ${{ matrix.os }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Install dependencies
        run: pnpm --dir app install --frozen-lockfile
      - name: Run frontend tests
        run: pnpm --dir app test
      - name: Run Rust tests
        run: pnpm --dir app rust:test
      - name: Create temporary signing certificate for CI validation
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $certificate = New-SelfSignedCertificate -Subject 'CN=bxane CI' -Type CodeSigningCert -CertStoreLocation Cert:\CurrentUser\My
          "WYRE_WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          'WYRE_CI_EPHEMERAL_SIGNING=true' >> $env:GITHUB_ENV
          'WYRE_PRIVILEGED_SIGN_COMMAND=["powershell.exe","-NoProfile","-NonInteractive","-ExecutionPolicy","Bypass","-File","scripts/sign-windows-file.ps1","{file}"]' >> $env:GITHUB_ENV
          Write-Output "Created temporary certificate $($certificate.Thumbprint)"
      - name: Generate temporary updater key for Windows CI validation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'wyre-ci-updater.key'
          pnpm --dir app exec tauri signer generate --ci --write-keys $keyPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate the CI-only updater key.' }
          "TAURI_SIGNING_PRIVATE_KEY=$keyPath" >> $env:GITHUB_ENV
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> $env:GITHUB_ENV
      - name: Generate temporary updater key for Linux and macOS CI validation
        if: runner.os != 'Windows'
        run: |
          pnpm --dir app exec tauri signer generate --ci --write-keys "$RUNNER_TEMP/wyre-ci-updater.key"
          # Tauri reads this variable as the key itself on Linux and macOS, not as a path to it.
          printf 'TAURI_SIGNING_PRIVATE_KEY=%s\n' "$(cat "$RUNNER_TEMP/wyre-ci-updater.key")" >> "$GITHUB_ENV"
          printf 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD=\n' >> "$GITHUB_ENV"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Build Linux installers
        if: runner.os == 'Linux'
        run: npm run dist:linux
      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: npm run dist:mac
      - name: Retain installer artifacts for manual runs
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: wyre-ci-test-installers-${{ runner.os }}-${{ runner.arch }}
          path: app/target/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error
      - name: Retain Linux installers for manual runs
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: wyre-ci-test-installers-${{ runner.os }}-${{ runner.arch }}
          path: |
            app/target/release/bundle/appimage/*.AppImage
            app/target/release/bundle/deb/*.deb
          retention-days: 7
          if-no-files-found: error
