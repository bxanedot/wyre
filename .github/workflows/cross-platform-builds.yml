name: Cross-platform builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rust-src-dir: app
          cache-workspaces: app -> app/target
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Install dependencies
        run: pnpm --dir app install --frozen-lockfile
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Build Linux installers
        if: runner.os == 'Linux'
        run: npm run dist:linux
      - name: Retain installer artifacts for manual runs
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: wyre-installers-${{ runner.os }}-${{ runner.arch }}
          path: app/target/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error
      - name: Retain Linux installers for manual runs
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: wyre-installers-${{ runner.os }}-${{ runner.arch }}
          path: |
            app/target/release/bundle/appimage/*.AppImage
            app/target/release/bundle/deb/*.deb
          retention-days: 7
          if-no-files-found: error
